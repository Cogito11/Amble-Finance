name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      # One platform failing (e.g. macOS) must not cancel the others mid-build.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win --x64 --arm64
          - os: ubuntu-latest
            args: --linux --x64 --arm64
          # Apple Silicon (M-series) only. macos-latest runners are arm64, so this builds natively.
          - os: macos-latest
            args: --mac --arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18.19.1
          cache: npm
          cache-dependency-path: Source/package-lock.json

      - name: Install dependencies
        working-directory: Source
        run: npm ci

      - name: Run tests
        working-directory: Source
        run: npm test

      - name: Build
        working-directory: Source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build -- ${{ matrix.args }}
